name: My Summer Car 2021 Mobile iOS - v1 NFS-Style Recovery

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  recover_and_export:
    name: 1. Recover APK, repair project, export iOS
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    env:
      UNITY_USERNAME: ${{ secrets.UNITY_USERNAME }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_EMAIL: ${{ secrets.UNITY_USERNAME }}

      SOURCE_UNITY: "2017.3.0f3"
      SOURCE_CHANGESET: "a9f86dcd79df"

      MIGRATION_UNITY: "2017.4.40f1"
      MIGRATION_CHANGESET: "6e14067f8a9a"

      BUILD_UNITY: "2019.4.40f1"
      BUILD_CHANGESET: "ffc62b691db5"

      EXPECTED_APK: "MSC2021Mobile.apk"
      EXPECTED_SHA256: "fbacd518ec0587a5797ee7ed539874b43338fe5c7982fbcadfa120917bc38590"

      WORK: ${{ github.workspace }}/msc-work
      APK: ${{ github.workspace }}/msc-work/MSC2021Mobile.apk
      APKROOT: ${{ github.workspace }}/msc-work/apk
      RECOVERED: ${{ github.workspace }}/msc-work/recovered
      OUTPUT: ${{ github.workspace }}/msc-output
      XCODE_OUT: ${{ github.workspace }}/msc-build/iOS/MSC2021Mobile-iOS

    outputs:
      xcode_ready: ${{ steps.detect_xcode.outputs.ready }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare folders
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            "$WORK" \
            "$OUTPUT" \
            "$GITHUB_WORKSPACE/msc-build"

          mkdir -p \
            "$WORK" \
            "$APKROOT" \
            "$RECOVERED" \
            "$OUTPUT" \
            "$GITHUB_WORKSPACE/msc-build/iOS"

      - name: Install Linux dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -o Acquire::Retries=4

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ca-certificates \
            curl \
            git \
            gnupg \
            jq \
            p7zip-full \
            unzip \
            xz-utils \
            zip \
            xvfb \
            libgconf-2-4 \
            libgtk2.0-0 \
            libgtk-3-0 \
            libnss3 \
            libasound2 \
            libglu1-mesa \
            libxss1 \
            libxtst6 \
            libxrandr2 \
            libxcursor1 \
            libxi6 \
            libxinerama1 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libdrm2 \
            libgbm1

      - name: Find MSC APK in repository or Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          FOUND=""

          echo "===== SEARCH REPOSITORY ====="

          FOUND="$(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "$EXPECTED_APK" \
              ! -path "$WORK/*" \
              -print \
              | head -1
          )"

          if [ -z "$FOUND" ]; then
            FOUND="$(
              find "$GITHUB_WORKSPACE" \
                -type f \
                -iname '*.apk' \
                ! -path "$WORK/*" \
                -printf '%s %p\n' \
                | sort -nr \
                | head -1 \
                | cut -d' ' -f2-
            )"
          fi

          if [ -n "$FOUND" ] && [ -f "$FOUND" ]; then
            if head -c 200 "$FOUND" 2>/dev/null | grep -q 'git-lfs.github.com/spec'; then
              echo "APK is a Git LFS pointer, pulling LFS..."
              git lfs install --local || true
              git lfs pull || true
            fi

            if [ -s "$FOUND" ] && \
               ! head -c 200 "$FOUND" 2>/dev/null | grep -q 'git-lfs.github.com/spec'; then
              cp "$FOUND" "$APK"
            fi
          fi

          if [ ! -s "$APK" ]; then
            echo "===== SEARCH GITHUB RELEASES ====="

            TAGS="$(
              gh release list \
                --repo "$GITHUB_REPOSITORY" \
                --limit 100 \
                --json tagName \
                --jq '.[].tagName' \
                2>/dev/null || true
            )"

            for TAG in $TAGS; do
              rm -rf "$WORK/release-one"
              mkdir -p "$WORK/release-one"

              gh release download "$TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --pattern "$EXPECTED_APK" \
                --dir "$WORK/release-one" \
                2>/dev/null || true

              CANDIDATE="$WORK/release-one/$EXPECTED_APK"

              if [ ! -s "$CANDIDATE" ]; then
                rm -rf "$WORK/release-one"
                mkdir -p "$WORK/release-one"

                gh release download "$TAG" \
                  --repo "$GITHUB_REPOSITORY" \
                  --pattern '*.apk' \
                  --dir "$WORK/release-one" \
                  2>/dev/null || true

                CANDIDATE="$(
                  find "$WORK/release-one" \
                    -type f \
                    -iname '*.apk' \
                    -printf '%s %p\n' \
                    | sort -nr \
                    | head -1 \
                    | cut -d' ' -f2-
                )"
              fi

              if [ -n "${CANDIDATE:-}" ] && [ -s "$CANDIDATE" ]; then
                cp "$CANDIDATE" "$APK"
                break
              fi
            done
          fi

          if [ ! -s "$APK" ]; then
            echo "::error::$EXPECTED_APK not found."
            echo "Put the APK in a GitHub Release asset. The workflow will download it automatically."
            exit 1
          fi

          echo "===== APK FOUND ====="
          ls -lh "$APK"

          ACTUAL_SHA="$(sha256sum "$APK" | awk '{print $1}')"
          echo "SHA256=$ACTUAL_SHA"

          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA256" ]; then
            echo "::error::APK SHA256 does not match the MSC2021Mobile.apk that was checked before this workflow."
            echo "Expected: $EXPECTED_SHA256"
            echo "Actual:   $ACTUAL_SHA"
            exit 1
          fi

      - name: Verify Unity 2017.3 Mono base
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$APKROOT"
          mkdir -p "$APKROOT"

          unzip -oq "$APK" -d "$APKROOT"

          DATA="$APKROOT/assets/bin/Data"
          ASM="$DATA/Managed/Assembly-CSharp.dll"

          test -s "$DATA/data.unity3d"
          test -s "$ASM"

          VERSION="$(
            strings "$DATA/data.unity3d" \
              | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+[abfp][0-9]+' \
              | head -1
          )"

          echo "Detected Unity: $VERSION"

          if [ "$VERSION" != "$SOURCE_UNITY" ]; then
            echo "::error::Expected Unity $SOURCE_UNITY, got ${VERSION:-unknown}"
            exit 1
          fi

          if find "$APKROOT" -type f -name 'libil2cpp.so' | grep -q .; then
            echo "::error::This APK is IL2CPP. Expected the checked Mono build."
            exit 1
          fi

          if ! find "$APKROOT" -type f -name 'libmono.so' | grep -q .; then
            echo "::error::libmono.so was not found."
            exit 1
          fi

          EXTRA_NATIVE="$(
            find "$APKROOT/lib" \
              -type f \
              -name '*.so' \
              -printf '%f\n' \
              | sort -u \
              | grep -Ev '^(libmain\.so|libmono\.so|libunity\.so)$' \
              || true
          )"

          if [ -n "$EXTRA_NATIVE" ]; then
            echo "::error::Unexpected Android-only native libraries were found:"
            echo "$EXTRA_NATIVE"
            exit 1
          fi

          {
            echo "APK=$EXPECTED_APK"
            echo "APK_SIZE=$(stat -c%s "$APK")"
            echo "APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')"
            echo "SOURCE_UNITY=$VERSION"
            echo "ASSEMBLY_CSHARP_SIZE=$(stat -c%s "$ASM")"
            echo
            echo "ARCHITECTURES:"
            find "$APKROOT/lib" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%f\n' \
              | sort
            echo
            echo "NATIVE_LIBRARIES:"
            find "$APKROOT/lib" \
              -type f \
              -name '*.so' \
              -printf '%P  %s bytes\n' \
              | sort
            echo
            echo "MANAGED_DLLS:"
            find "$DATA/Managed" \
              -type f \
              -name '*.dll' \
              -printf '%f  %s bytes\n' \
              | sort
          } | tee "$OUTPUT/apk-summary.txt"

      - name: Extract original APK icon
        shell: bash
        run: |
          set -euo pipefail

          ICON="$(
            find "$APKROOT/res" \
              -type f \
              -name 'app_icon.png' \
              -printf '%s %p\n' \
              | sort -nr \
              | head -1 \
              | cut -d' ' -f2-
          )"

          if [ -z "$ICON" ] || [ ! -s "$ICON" ]; then
            echo "::error::Original app_icon.png was not found."
            exit 1
          fi

          cp "$ICON" "$OUTPUT/MSC2021-original-icon.png"

          file "$OUTPUT/MSC2021-original-icon.png"
          ls -lh "$OUTPUT/MSC2021-original-icon.png"

      - name: Download AssetRipper 2.0.0
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p "$WORK/tools/assetripper"

          gh release download 2.0.0 \
            -R AssetRipper/AssetRipper \
            -p 'AssetRipper_linux_x64.tar.xz' \
            -D "$WORK/tools"

          tar -xJf \
            "$WORK/tools/AssetRipper_linux_x64.tar.xz" \
            -C "$WORK/tools/assetripper"

          RIPPER="$(
            find "$WORK/tools/assetripper" \
              -type f \
              \( \
                -name 'AssetRipper.GUI.Free' \
                -o -name 'AssetRipper.GUI' \
                -o -name 'AssetRipper' \
              \) \
              -print \
              | head -1
          )"

          if [ -z "$RIPPER" ]; then
            echo "::error::AssetRipper executable was not found."
            exit 1
          fi

          chmod +x "$RIPPER"
          echo "RIPPER=$RIPPER" >> "$GITHUB_ENV"

      - name: Recover editable Unity project
        id: recover
        shell: bash
        run: |
          set -euo pipefail

          PORT=3333
          EXPORT="$RECOVERED/MSC2021Mobile"

          mkdir -p "$EXPORT"

          "$RIPPER" \
            --headless \
            --port "$PORT" \
            > "$OUTPUT/assetripper.log" 2>&1 &

          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT

          READY=0

          for i in $(seq 1 120); do
            if curl -fsS "http://127.0.0.1:${PORT}/" >/dev/null 2>&1; then
              READY=1
              break
            fi

            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "::error::AssetRipper did not start."
            tail -300 "$OUTPUT/assetripper.log" || true
            exit 1
          fi

          LOAD_CODE="$(
            curl -sS \
              -o "$OUTPUT/assetripper-load-response.txt" \
              -w '%{http_code}' \
              -H 'Content-Type: application/x-www-form-urlencoded' \
              --data-urlencode "Path=$APKROOT" \
              "http://127.0.0.1:${PORT}/LoadFolder"
          )"

          echo "LOAD_HTTP=$LOAD_CODE"

          if [ "$LOAD_CODE" != "200" ] && [ "$LOAD_CODE" != "302" ]; then
            echo "::error::AssetRipper LoadFolder failed."
            cat "$OUTPUT/assetripper-load-response.txt" || true
            exit 1
          fi

          EXPORT_CODE="$(
            curl -sS \
              -o "$OUTPUT/assetripper-export-response.txt" \
              -w '%{http_code}' \
              -H 'Content-Type: application/x-www-form-urlencoded' \
              --data-urlencode "Path=$EXPORT" \
              --data-urlencode 'CreateSubfolder=false' \
              "http://127.0.0.1:${PORT}/Export/UnityProject"
          )"

          echo "EXPORT_HTTP=$EXPORT_CODE"

          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          trap - EXIT

          if [ "$EXPORT_CODE" != "200" ] && [ "$EXPORT_CODE" != "302" ]; then
            echo "::error::AssetRipper Unity project export failed."
            cat "$OUTPUT/assetripper-export-response.txt" || true
            tail -500 "$OUTPUT/assetripper.log" || true
            exit 1
          fi

          PROJECT=""

          if [ -d "$EXPORT/ExportedProject/Assets" ]; then
            PROJECT="$EXPORT/ExportedProject"
          elif [ -d "$EXPORT/Assets" ]; then
            PROJECT="$EXPORT"
          else
            PROJECT="$(
              find "$EXPORT" \
                -type d \
                -name Assets \
                -print \
                | head -1 \
                | xargs -r dirname
            )"
          fi

          if [ -z "$PROJECT" ] || [ ! -d "$PROJECT/Assets" ]; then
            echo "::error::Recovered Unity project was not found."
            find "$EXPORT" -maxdepth 5 -type d | head -300
            exit 1
          fi

          PROJECT="$(realpath "$PROJECT")"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

          {
            echo "RECOVERED_PROJECT=$PROJECT"
            echo "SCENES=$(find "$PROJECT/Assets" -type f -name '*.unity' | wc -l | tr -d ' ')"
            echo "CS_FILES=$(find "$PROJECT/Assets" -type f -name '*.cs' | wc -l | tr -d ' ')"
            echo "DLLS=$(find "$PROJECT/Assets" -type f -name '*.dll' | wc -l | tr -d ' ')"
            echo "MATERIALS=$(find "$PROJECT/Assets" -type f -name '*.mat' | wc -l | tr -d ' ')"
            echo "SHADERS=$(find "$PROJECT/Assets" -type f -name '*.shader' | wc -l | tr -d ' ')"
            echo
            echo "SCENES:"
            find "$PROJECT/Assets" -type f -name '*.unity' | sort
          } | tee "$OUTPUT/recovery-summary.txt"

      - name: Audit and rename AssetRipper dummy shaders
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.recover.outputs.project }}"
          export PROJECT

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          project = Path(os.environ["PROJECT"])
          assets = project / "Assets"
          out = Path(os.environ["OUTPUT"])

          shader_files = list(assets.rglob("*.shader"))
          dummy = []
          renamed = []

          shader_decl = re.compile(r'Shader\s+"([^"]+)"')

          for p in shader_files:
              s = p.read_text(encoding="utf-8", errors="replace")

              if "DummyShaderTextExporter" not in s:
                  continue

              m = shader_decl.search(s)
              old_name = m.group(1) if m else p.stem
              dummy.append((p, old_name))

              if m and not old_name.startswith("RecoveredDummy/"):
                  new_name = "RecoveredDummy/" + old_name
                  s = s[:m.start(1)] + new_name + s[m.end(1):]
                  p.write_text(s, encoding="utf-8")
                  renamed.append((p, old_name, new_name))

          report = []
          report.append(f"TOTAL_SHADER_FILES={len(shader_files)}")
          report.append(f"DUMMY_SHADER_FILES={len(dummy)}")
          report.append(f"RENAMED_DUMMY_SHADERS={len(renamed)}")
          report.append("")
          report.append("DUMMY_SHADERS:")

          for p, name in dummy:
              report.append(f"{p.relative_to(project)} :: {name}")

          (out / "shader-audit.txt").write_text(
              "\n".join(report) + "\n",
              encoding="utf-8"
          )

          print("\n".join(report[:20]))

          if len(shader_files) > 0 and len(dummy) == len(shader_files):
              print("WARNING: every exported .shader file is an AssetRipper dummy.")
              print("The workflow will repair common Standard/Mobile/Legacy/UI/Particle materials in Unity before export.")
          PY

      - name: Prepare recovered project for Unity migration
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.recover.outputs.project }}"
          export PROJECT

          echo "===== REMOVE ANDROID-ONLY PLUGIN FILES ====="

          find "$PROJECT/Assets" \
            -type f \
            \( \
              -iname '*.so' \
              -o -iname '*.aar' \
              -o -iname '*.jar' \
              -o -iname '*.apk' \
            \) \
            -print \
            | tee "$OUTPUT/removed-android-files.txt" \
            || true

          find "$PROJECT/Assets" \
            -type f \
            \( \
              -iname '*.so' \
              -o -iname '*.aar' \
              -o -iname '*.jar' \
              -o -iname '*.apk' \
            \) \
            -delete \
            || true

          rm -rf "$PROJECT/Assets/Plugins/Android" || true

          echo "===== REMOVE RECOVERED UNITY/BCL DLL COPIES ====="

          python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path

          project = Path(os.environ["PROJECT"])
          assets = project / "Assets"

          exact_names = {
              "mscorlib.dll",
              "System.dll",
              "System.Core.dll",
              "System.Xml.dll",
              "System.Xml.Linq.dll",
              "System.Configuration.dll",
              "System.Runtime.Serialization.dll",
              "System.Security.dll",
              "Mono.Security.dll",
              "Mono.Posix.dll",
              "Boo.Lang.dll",
              "UnityScript.Lang.dll",
          }

          moved_root = project.parent / "removed-runtime-dlls"

          for p in list(assets.rglob("*.dll")):
              if p.name.startswith("UnityEngine.") or p.name == "UnityEngine.dll" or p.name in exact_names:
                  rel = p.relative_to(assets)
                  dst = moved_root / rel
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.move(str(p), str(dst))

                  meta = Path(str(p) + ".meta")

                  if meta.exists():
                      shutil.move(str(meta), str(dst) + ".meta")

                  print("moved", rel)
          PY

          mkdir -p \
            "$PROJECT/Assets/MSC2021iOS/Editor"

          cp \
            "$OUTPUT/MSC2021-original-icon.png" \
            "$PROJECT/Assets/MSC2021iOS/app_icon.png"

          cat > "$PROJECT/ProjectSettings/ProjectVersion.txt" <<'EOF'
          m_EditorVersion: 2017.4.40f1
          m_EditorVersionWithRevision: 2017.4.40f1 (6e14067f8a9a)
          EOF

          echo "===== PATCH COMMON OLD UNITY APIS ====="

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          project = Path(os.environ["PROJECT"])
          assets = project / "Assets"
          changed = []

          for p in assets.rglob("*.cs"):
              s = p.read_text(encoding="utf-8", errors="replace")
              old = s

              s = re.sub(
                  r'^\s*using\s+UnityScript(?:\.[A-Za-z_][A-Za-z0-9_.]*)?\s*;\s*$',
                  '',
                  s,
                  flags=re.M
              )

              s = re.sub(r'\bGUIText\b', 'UnityEngine.UI.Text', s)
              s = re.sub(r'\bGUITexture\b', 'UnityEngine.UI.RawImage', s)

              s = s.replace(
                  'Graphics.DrawProceduralIndirect(',
                  'Graphics.DrawProceduralIndirectNow('
              )

              s = s.replace(
                  'ComputeBufferType.DrawIndirect',
                  'ComputeBufferType.IndirectArguments'
              )

              s = s.replace(
                  'Application.LoadLevelAsync(',
                  'UnityEngine.SceneManagement.SceneManager.LoadSceneAsync('
              )

              s = s.replace(
                  'Application.LoadLevel(',
                  'UnityEngine.SceneManagement.SceneManager.LoadScene('
              )

              s = s.replace(
                  'Application.loadedLevelName',
                  'UnityEngine.SceneManagement.SceneManager.GetActiveScene().name'
              )

              s = s.replace(
                  'Application.loadedLevel',
                  'UnityEngine.SceneManagement.SceneManager.GetActiveScene().buildIndex'
              )

              s = re.sub(
                  r'(?<![A-Za-z0-9_\.])([A-Za-z_][A-Za-z0-9_]*)\.hdr\b',
                  r'\1.allowHDR',
                  s
              )

              s = re.sub(
                  r'\bParticleRenderer\b',
                  'ParticleSystemRenderer',
                  s
              )

              if s != old:
                  p.write_text(s, encoding="utf-8")
                  changed.append(str(p.relative_to(project)))

          out = Path(os.environ["OUTPUT"])
          (out / "legacy-api-patched.txt").write_text(
              "\n".join(changed) + ("\n" if changed else ""),
              encoding="utf-8"
          )

          print("Patched C# files:", len(changed))
          PY

      - name: Setup Node 22 and Unity licensing helper
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Unity Hub and activation helper
        shell: bash
        run: |
          set -euo pipefail

          npm install -g @rage-against-the-pixel/unity-cli

          sudo install -d -m 0755 /etc/apt/keyrings

          curl -fsSL \
            https://hub.unity3d.com/linux/keys/public \
            | sudo gpg --dearmor \
              -o /etc/apt/keyrings/unityhub.gpg

          echo \
            "deb [arch=amd64 signed-by=/etc/apt/keyrings/unityhub.gpg] https://hub.unity3d.com/linux/repos/deb stable main" \
            | sudo tee \
              /etc/apt/sources.list.d/unityhub.list \
              >/dev/null

          sudo apt-get update -o Acquire::Retries=4 || true
          sudo apt-get install -y unityhub

          HUB_CMD="$(command -v unityhub)"

          sudo mkdir -p /opt/unityhub

          sudo tee /opt/unityhub/unityhub >/dev/null <<EOF
          #!/bin/bash
          exec xvfb-run -a "$HUB_CMD" --no-sandbox --headless "\$@"
          EOF

          sudo chmod +x /opt/unityhub/unityhub

          echo "UNITY_HUB_PATH=/opt/unityhub/unityhub" >> "$GITHUB_ENV"
          echo "/opt/unityhub" >> "$GITHUB_PATH"

      - name: Check Unity credentials
        shell: bash
        run: |
          set -euo pipefail

          test -n "${UNITY_USERNAME:-}" || {
            echo "::error::UNITY_USERNAME repository secret is missing."
            exit 1
          }

          test -n "${UNITY_PASSWORD:-}" || {
            echo "::error::UNITY_PASSWORD repository secret is missing."
            exit 1
          }

          echo "Unity credentials are present."

      - name: Activate Unity Personal
        shell: bash
        env:
          UNITY_HUB_PATH: /opt/unityhub/unityhub
        run: |
          set -euo pipefail

          CLIENT="$(
            find /usr /opt "$HOME" \
              -type f \
              -name 'Unity.Licensing.Client' \
              2>/dev/null \
              | head -1
          )"

          if [ -n "${CLIENT:-}" ]; then
            CLIENT_DIR="$(dirname "$CLIENT")"

            sudo rm -rf /opt/unityhub/UnityLicensingClient
            sudo mkdir -p /opt/unityhub/UnityLicensingClient
            sudo cp -a "$CLIENT_DIR"/. /opt/unityhub/UnityLicensingClient/
            sudo chmod +x /opt/unityhub/UnityLicensingClient/Unity.Licensing.Client || true
          fi

          GLOBAL_NODE_MODULES="$(npm root -g)"
          LICENSE_MODULE="$GLOBAL_NODE_MODULES/@rage-against-the-pixel/unity-cli/dist/license-client.js"

          test -f "$LICENSE_MODULE"

          export LICENSE_MODULE

          node <<'NODE'
          const { LicensingClient, LicenseType } =
            require(process.env.LICENSE_MODULE);

          async function main() {
            const client = new LicensingClient('6.x');

            await client.Activate(
              {
                licenseType: LicenseType.personal,
                username: process.env.UNITY_USERNAME,
                password: process.env.UNITY_PASSWORD
              },
              true
            );

            console.log("UNITY PERSONAL ACTIVATION: SUCCESS");
          }

          main().catch((e) => {
            console.error("UNITY PERSONAL ACTIVATION FAILED");
            console.error(e && e.stack ? e.stack : e);
            process.exit(1);
          });
          NODE

      - name: Install Unity 2017.4.40f1
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$WORK/unity-2017"

          URL="https://download.unity3d.com/download_unity/${MIGRATION_CHANGESET}/LinuxEditorInstaller/Unity-${MIGRATION_UNITY}.tar.xz"

          curl -fL \
            --retry 5 \
            --retry-delay 5 \
            "$URL" \
            -o "$WORK/Unity-${MIGRATION_UNITY}.tar.xz"

          tar -xJf \
            "$WORK/Unity-${MIGRATION_UNITY}.tar.xz" \
            -C "$WORK/unity-2017"

          UNITY2017="$(
            find "$WORK/unity-2017" \
              -type f \
              -path '*/Editor/Unity' \
              -perm -111 \
              -print \
              | head -1
          )"

          test -n "$UNITY2017"

          echo "UNITY2017=$UNITY2017" >> "$GITHUB_ENV"
          "$UNITY2017" -version || true

      - name: Unity 2017 compatibility migration
        shell: bash
        run: |
          set +e

          PROJECT="${{ steps.recover.outputs.project }}"
          export PROJECT

          LOG="$OUTPUT/unity-2017-migration.log"

          rm -rf \
            "$PROJECT/Library" \
            "$PROJECT/Temp" \
            "$PROJECT/obj" \
            2>/dev/null || true

          timeout 75m \
            xvfb-run -a \
            "$UNITY2017" \
            -batchmode \
            -nographics \
            -quit \
            -projectPath "$PROJECT" \
            -logFile "$LOG"

          RC=$?

          echo "UNITY2017_EXIT_CODE=$RC" | tee "$OUTPUT/unity-2017-exit-code.txt"

          tail -350 "$LOG" || true

          set -e

