          cat > "$PROJECT/Assets/MSC2021iOS/MSC2021RuntimeLogger.cs" <<'CS'
          using System;
          using System.IO;
          using UnityEngine;
          using UnityEngine.SceneManagement;

          public sealed class MSC2021RuntimeLogger : MonoBehaviour
          {
              private string logPath;

              [RuntimeInitializeOnLoadMethod(RuntimeInitializeLoadType.BeforeSceneLoad)]
              private static void Install()
              {
                  if (FindObjectOfType<MSC2021RuntimeLogger>() != null)
                      return;

                  var go = new GameObject("MSC2021-iOS-Stability");
                  DontDestroyOnLoad(go);
                  go.AddComponent<MSC2021RuntimeLogger>();
              }

              private void Awake()
              {
                  logPath = Path.Combine(
                      Application.persistentDataPath,
                      "msc2021-ios-runtime.log"
                  );

                  Screen.sleepTimeout = SleepTimeout.NeverSleep;
                  Input.multiTouchEnabled = true;
                  QualitySettings.vSyncCount = 0;
                  Application.targetFrameRate = 60;

                  Application.logMessageReceived += OnLog;
                  Application.lowMemory += OnLowMemory;
                  SceneManager.sceneLoaded += OnSceneLoaded;

                  Write(
                      "START Unity=" + Application.unityVersion +
                      " OS=" + SystemInfo.operatingSystem +
                      " GPU=" + SystemInfo.graphicsDeviceName +
                      " Graphics=" + SystemInfo.graphicsDeviceVersion
                  );
              }

              private void OnDestroy()
              {
                  Application.logMessageReceived -= OnLog;
                  Application.lowMemory -= OnLowMemory;
                  SceneManager.sceneLoaded -= OnSceneLoaded;
              }

              private void OnLowMemory()
              {
                  Write("LOW_MEMORY");
                  Resources.UnloadUnusedAssets();
              }

              private void OnSceneLoaded(Scene scene, LoadSceneMode mode)
              {
                  Write("SCENE_LOADED " + scene.name);
              }

              private void OnLog(string condition, string stackTrace, LogType type)
              {
                  if (type == LogType.Log)
                      return;

                  Write(
                      "[" + type + "] " +
                      condition + "\n" +
                      stackTrace
                  );
              }

              private void Write(string message)
              {
                  try
                  {
                      File.AppendAllText(
                          logPath,
                          "[" + DateTime.UtcNow.ToString("O") + "] " +
                          message + "\n"
                      );
                  }
                  catch
                  {
                  }
              }
          }
          CS

          cat > "$PROJECT/Assets/MSC2021iOS/Editor/MSC2021IOSBuild.cs" <<'CS'
          using System;
          using System.IO;
          using System.Linq;
          using System.Collections.Generic;
          using UnityEditor;
          using UnityEditor.Build.Reporting;
          using UnityEngine;
          using UnityEngine.Rendering;

          public static class MSC2021IOSBuild
          {
              private const string DummyPrefix = "RecoveredDummy/";

              public static void WarmupAndRepair()
              {
                  RepairMaterials();
                  AssetDatabase.SaveAssets();
                  AssetDatabase.Refresh();
              }

              public static void PerformBuild()
              {
                  string output =
                      Environment.GetEnvironmentVariable("MSC_IOS_XCODE_PATH");

                  if (String.IsNullOrEmpty(output))
                      throw new Exception("MSC_IOS_XCODE_PATH is missing.");

                  Directory.CreateDirectory(output);

                  RepairMaterials();
                  ApplyOriginalIcon();

                  EditorUserBuildSettings.SwitchActiveBuildTarget(
                      BuildTargetGroup.iOS,
                      BuildTarget.iOS
                  );

                  PlayerSettings.companyName = "MSC 2021 Mobile iOS Port";
                  PlayerSettings.productName = "My Summer Car 2021 Mobile";
                  PlayerSettings.bundleVersion = "1.0";

                  PlayerSettings.SetApplicationIdentifier(
                      BuildTargetGroup.iOS,
                      "com.negel.msc2021mobile"
                  );

                  PlayerSettings.SetScriptingBackend(
                      BuildTargetGroup.iOS,
                      ScriptingImplementation.IL2CPP
                  );

                  PlayerSettings.SetApiCompatibilityLevel(
                      BuildTargetGroup.iOS,
                      ApiCompatibilityLevel.NET_4_6
                  );

                  PlayerSettings.iOS.targetOSVersionString = "12.0";
                  PlayerSettings.iOS.sdkVersion = iOSSdkVersion.DeviceSDK;
                  PlayerSettings.iOS.targetDevice = iOSTargetDevice.iPhoneAndiPad;
                  PlayerSettings.iOS.appleEnableAutomaticSigning = false;

                  PlayerSettings.stripEngineCode = false;

                  PlayerSettings.SetManagedStrippingLevel(
                      BuildTargetGroup.iOS,
                      ManagedStrippingLevel.Disabled
                  );

                  PlayerSettings.colorSpace = ColorSpace.Gamma;
                  PlayerSettings.defaultInterfaceOrientation =
                      UIOrientation.LandscapeLeft;

                  PlayerSettings.allowedAutorotateToPortrait = false;
                  PlayerSettings.allowedAutorotateToPortraitUpsideDown = false;
                  PlayerSettings.allowedAutorotateToLandscapeLeft = true;
                  PlayerSettings.allowedAutorotateToLandscapeRight = true;

                  PlayerSettings.SetUseDefaultGraphicsAPIs(
                      BuildTarget.iOS,
                      false
                  );

                  PlayerSettings.SetGraphicsAPIs(
                      BuildTarget.iOS,
                      new[]
                      {
                          GraphicsDeviceType.Metal
                      }
                  );

                  string[] scenes = GetScenes();

                  if (scenes.Length == 0)
                      throw new Exception("No recovered Unity scenes were found.");

                  Debug.Log("===== MSC2021 iOS SCENES =====");

                  foreach (string scene in scenes)
                      Debug.Log(scene);

                  var options = new BuildPlayerOptions
                  {
                      scenes = scenes,
                      locationPathName = output,
                      target = BuildTarget.iOS,
                      targetGroup = BuildTargetGroup.iOS,
                      options = BuildOptions.None
                  };

                  BuildReport report = BuildPipeline.BuildPlayer(options);
                  BuildSummary summary = report.summary;

                  Debug.Log(
                      "MSC2021 iOS build result: " +
                      summary.result +
                      " errors=" + summary.totalErrors +
                      " warnings=" + summary.totalWarnings
                  );

                  if (summary.result != BuildResult.Succeeded)
                  {
                      throw new Exception(
                          "iOS Xcode export failed: " +
                          summary.result +
                          ", errors=" +
                          summary.totalErrors
                      );
                  }
              }

              private static string[] GetScenes()
              {
                  string[] enabled = EditorBuildSettings.scenes
                      .Where(s => s.enabled && File.Exists(s.path))
                      .Select(s => s.path)
                      .Distinct()
                      .ToArray();

                  if (enabled.Length > 0)
                      return enabled;

                  string[] all = AssetDatabase
                      .FindAssets("t:Scene")
                      .Select(AssetDatabase.GUIDToAssetPath)
                      .Where(
                          p => p.EndsWith(
                              ".unity",
                              StringComparison.OrdinalIgnoreCase
                          )
                      )
                      .Distinct()
                      .ToArray();

                  string[] preferred =
                  {
                      "menu",
                      "mainmenu",
                      "main menu",
                      "loading",
                      "game",
                      "house",
                      "world"
                  };

                  var ordered = new List<string>();

                  foreach (string wanted in preferred)
                  {
                      foreach (string scene in all)
                      {
                          string name = Path
                              .GetFileNameWithoutExtension(scene)
                              .ToLowerInvariant();

                          if (
                              name.Contains(wanted.Replace(" ", "")) ||
                              name.Contains(wanted)
                          )
                          {
                              if (!ordered.Contains(scene))
                                  ordered.Add(scene);
                          }
                      }
                  }

                  foreach (string scene in all.OrderBy(x => x))
                  {
                      if (!ordered.Contains(scene))
                          ordered.Add(scene);
                  }

                  return ordered.ToArray();
              }

              private static void RepairMaterials()
              {
                  var report = new List<string>();
                  int repaired = 0;
                  int untouched = 0;

                  string[] guids = AssetDatabase.FindAssets("t:Material");

                  foreach (string guid in guids)
                  {
                      string path = AssetDatabase.GUIDToAssetPath(guid);
                      Material mat = AssetDatabase.LoadAssetAtPath<Material>(path);

                      if (mat == null)
                          continue;

                      Shader current = mat.shader;
                      string name =
                          current == null
                              ? ""
                              : current.name;

                      bool needsRepair =
                          current == null ||
                          !current.isSupported ||
                          name.StartsWith(
                              DummyPrefix,
                              StringComparison.OrdinalIgnoreCase
                          );

                      if (!needsRepair)
                      {
                          untouched++;
                          continue;
                      }

                      string originalName = name;

                      if (
                          originalName.StartsWith(
                              DummyPrefix,
                              StringComparison.OrdinalIgnoreCase
                          )
                      )
                      {
                          originalName =
                              originalName.Substring(
                                  DummyPrefix.Length
                              );
                      }

                      Shader replacement =
                          FindReplacementShader(originalName);

                      if (replacement == null)
                      {
                          report.Add(
                              "FAILED :: " +
                              path +
                              " :: " +
                              originalName
                          );

                          continue;
                      }

                      mat.shader = replacement;
                      EditorUtility.SetDirty(mat);
                      repaired++;

                      report.Add(
                          "REPAIRED :: " +
                          path +
                          " :: " +
                          originalName +
                          " -> " +
                          replacement.name
                      );
                  }

                  AssetDatabase.SaveAssets();

                  report.Insert(
                      0,
                      "UNTOUCHED=" + untouched
                  );

                  report.Insert(
                      0,
                      "REPAIRED=" + repaired
                  );

                  string dir =
                      Environment.GetEnvironmentVariable(
                          "MSC_DIAG_DIR"
                      );

                  if (!String.IsNullOrEmpty(dir))
                  {
                      Directory.CreateDirectory(dir);

                      File.WriteAllLines(
                          Path.Combine(
                              dir,
                              "material-repair.txt"
                          ),
                          report.ToArray()
                      );
                  }

                  Debug.Log(
                      "MSC material repair: repaired=" +
                      repaired +
                      " untouched=" +
                      untouched
                  );
              }

              private static Shader FindReplacementShader(
                  string original
              )
              {
                  string s =
                      (original ?? "")
                      .Trim();

                  string lower =
                      s.ToLowerInvariant();

                  string[] candidates;

                  if (lower.Contains("ui/"))
                  {
                      candidates = new[]
                      {
                          "UI/Default",
                          "Unlit/Transparent",
                          "Standard"
                      };
                  }
                  else if (lower.Contains("sprite"))
                  {
                      candidates = new[]
                      {
                          "Sprites/Default",
                          "Unlit/Transparent",
                          "Standard"
                      };
                  }
                  else if (lower.Contains("particle"))
                  {
                      candidates = new[]
                      {
                          "Particles/Standard Unlit",
                          "Legacy Shaders/Particles/Additive",
                          "Legacy Shaders/Particles/Alpha Blended",
                          "Standard"
                      };
                  }
                  else if (
                      lower.Contains("transparent") ||
                      lower.Contains("fade")
                  )
                  {
                      candidates = new[]
                      {
                          "Legacy Shaders/Transparent/Diffuse",
                          "Unlit/Transparent",
                          "Standard"
                      };
                  }
                  else if (
                      lower.Contains("cutout") ||
                      lower.Contains("alphatest")
                  )
                  {
                      candidates = new[]
                      {
                          "Legacy Shaders/Transparent/Cutout/Diffuse",
                          "Unlit/Transparent Cutout",
                          "Standard"
                      };
                  }
                  else if (lower.Contains("mobile/"))
                  {
                      candidates = new[]
                      {
                          s,
                          "Mobile/Diffuse",
                          "Standard"
                      };
                  }
                  else if (lower.Contains("legacy shaders/"))
                  {
                      candidates = new[]
                      {
                          s,
                          "Legacy Shaders/Diffuse",
                          "Standard"
                      };
                  }
                  else if (lower.Contains("specular"))
                  {
                      candidates = new[]
                      {
                          "Standard (Specular setup)",
                          "Standard"
                      };
                  }
                  else if (lower.Contains("unlit"))
                  {
                      candidates = new[]
                      {
                          "Unlit/Texture",
                          "Standard"
                      };
                  }
                  else
                  {
                      candidates = new[]
                      {
                          s,
                          "Standard",
                          "Legacy Shaders/Diffuse",
                          "Mobile/Diffuse"
                      };
                  }

                  foreach (string candidate in candidates)
                  {
                      if (String.IsNullOrEmpty(candidate))
                          continue;

                      Shader shader = Shader.Find(candidate);

                      if (
                          shader != null &&
                          shader.isSupported &&
                          !shader.name.StartsWith(
                              DummyPrefix,
                              StringComparison.OrdinalIgnoreCase
                          )
                      )
                      {
                          return shader;
                      }
                  }

                  return null;
              }

              private static void ApplyOriginalIcon()
              {
                  const string iconPath =
                      "Assets/MSC2021iOS/app_icon.png";

                  AssetDatabase.ImportAsset(
                      iconPath,
                      ImportAssetOptions.ForceSynchronousImport |
                      ImportAssetOptions.ForceUpdate
                  );

                  var importer =
                      AssetImporter.GetAtPath(
                          iconPath
                      ) as TextureImporter;

                  if (importer != null)
                  {
                      importer.textureType =
                          TextureImporterType.Default;

                      importer.alphaIsTransparency = true;
                      importer.mipmapEnabled = false;
                      importer.textureCompression =
                          TextureImporterCompression.Uncompressed;

                      importer.SaveAndReimport();
                  }

                  Texture2D icon =
                      AssetDatabase.LoadAssetAtPath<Texture2D>(
                          iconPath
                      );

                  if (icon == null)
                      return;

                  int[] sizes =
                      PlayerSettings.GetIconSizesForTargetGroup(
                          BuildTargetGroup.iOS
                      );

                  Texture2D[] icons =
                      new Texture2D[sizes.Length];

                  for (int i = 0; i < icons.Length; i++)
                      icons[i] = icon;

                  PlayerSettings.SetIconsForTargetGroup(
                      BuildTargetGroup.iOS,
                      icons
                  );
              }
          }
          CS

      - name: Install official Unity CLI
        shell: bash
        run: |
          set -euo pipefail

          export UNITY_CLI_HOME="$WORK/tools/unity-official-cli"
          export UNITY_CLI_CHANNEL="beta"
          export UNITY_NON_INTERACTIVE=1
          export UNITY_NO_CONSENT_PROMPT=1
          export UNITY_NO_UPDATE_CHECK=1

          mkdir -p "$UNITY_CLI_HOME"

          curl -fsSL \
            --retry 5 \
            --retry-delay 3 \
            https://public-cdn.cloud.unity3d.com/hub/prod/cli/install.sh \
            -o "$WORK/unity-cli-install.sh"

          bash "$WORK/unity-cli-install.sh"

          OFFICIAL="$UNITY_CLI_HOME/bin/unity"

          test -x "$OFFICIAL"

          echo "OFFICIAL_UNITY_CLI=$OFFICIAL" >> "$GITHUB_ENV"
          "$OFFICIAL" --version

      - name: Install Unity 2019.4.40f1 and iOS support
        shell: bash
        run: |
          set -euo pipefail

          INSTALL_ROOT="$HOME/UnityEditors"

          mkdir -p "$INSTALL_ROOT"

          export UNITY_NON_INTERACTIVE=1
          export UNITY_NO_CONSENT_PROMPT=1
          export UNITY_NO_UPDATE_CHECK=1
          export UNITY_INSTALL_RETRIES=3

          "$OFFICIAL_UNITY_CLI" \
            --non-interactive \
            --no-banner \
            --no-color \
            editors install-path \
            --set "$INSTALL_ROOT"

          set +e

          timeout 85m \
            "$OFFICIAL_UNITY_CLI" \
            --non-interactive \
            --no-banner \
            --no-color \
            install "$BUILD_UNITY" \
            --changeset "$BUILD_CHANGESET" \
            --module ios \
            --no-child-modules \
            --yes \
            --accept-eula \
            2>&1 \
            | tee "$OUTPUT/unity-2019-install.log"

          RC=${PIPESTATUS[0]}

          set -e

          if [ "$RC" -ne 0 ]; then
            echo "::error::Unity 2019 install failed with exit $RC."
            exit "$RC"
          fi

          UNITY2019="$(
            find "$INSTALL_ROOT" \
              -type f \
              -path '*/Editor/Unity' \
              -perm -111 \
              -print \
              | grep '2019.4.40f1' \
              | head -1
          )"

          if [ -z "${UNITY2019:-}" ]; then
            UNITY2019="$(
              find "$INSTALL_ROOT" \
                -type f \
                -path '*/Editor/Unity' \
                -perm -111 \
                -print \
                | head -1
            )"
          fi

          if [ -z "$UNITY2019" ]; then
            echo "::error::Unity 2019 Editor executable was not found."
            exit 1
          fi

          echo "UNITY2019=$UNITY2019" >> "$GITHUB_ENV"
          "$UNITY2019" -version || true

      - name: Unity 2019 warm-up and material repair
        id: warmup
        shell: bash
        env:
          MSC_DIAG_DIR: ${{ github.workspace }}/msc-output
        run: |
          set +e

          PROJECT="${{ steps.recover.outputs.project }}"
          export PROJECT

          LOG="$OUTPUT/unity-2019-warmup.log"

          rm -rf \
            "$PROJECT/Library" \
            "$PROJECT/Temp" \
            "$PROJECT/obj" \
            2>/dev/null || true

          timeout 90m \
            xvfb-run -a \
            "$UNITY2019" \
            -batchmode \
            -nographics \
            -quit \
            -accept-apiupdate \
            -projectPath "$PROJECT" \
            -executeMethod MSC2021IOSBuild.WarmupAndRepair \
            -logFile "$LOG"

          RC=$?

          echo "UNITY2019_WARMUP_EXIT_CODE=$RC" \
            | tee "$OUTPUT/unity-2019-warmup-exit-code.txt"

          tail -500 "$LOG" || true

          grep -nEi \
            -A 20 \
            -B 8 \
            'error CS[0-9]+|Compilation failed|Scripts have compiler errors|Exception|Fatal error|failed' \
            "$LOG" \
            | tail -700 \
            > "$OUTPUT/unity-2019-warmup-important-errors.txt" \
            || true

          set -e

      - name: Final compile audit
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.recover.outputs.project }}"

          echo "===== OLD UNITYSCRIPT USING ====="

          if grep -RIn \
            --include='*.cs' \
            -E '^[[:space:]]*using[[:space:]]+UnityScript' \
            "$PROJECT/Assets"
          then
            echo "::error::UnityScript using directive remains."
            exit 1
          fi

          echo "===== OLD CAMERA HDR PROPERTY ====="

          grep -RIn \
            --include='*.cs' \
            '\.hdr\b' \
            "$PROJECT/Assets" \
            | tee "$OUTPUT/remaining-camera-hdr.txt" \
            || true

          echo "===== ANDROIDJAVA REFERENCES ====="

          grep -RIn \
            --include='*.cs' \
            -E 'AndroidJava(Class|Object)|AndroidJNI' \
            "$PROJECT/Assets" \
            | tee "$OUTPUT/androidjava-references.txt" \
            || true

          echo "Compile audit completed."

      - name: Build MSC2021 iOS Xcode project
        id: unity_build
        shell: bash
        env:
          MSC_IOS_XCODE_PATH: ${{ github.workspace }}/msc-build/iOS/MSC2021Mobile-iOS
          MSC_DIAG_DIR: ${{ github.workspace }}/msc-output
        run: |
          set +e

          PROJECT="${{ steps.recover.outputs.project }}"
          LOG="$OUTPUT/unity-2019-ios-build.log"

          rm -rf \
            "$PROJECT/Library/ScriptAssemblies" \
            "$PROJECT/Temp" \
            "$PROJECT/obj" \
            2>/dev/null || true

          echo "===== MY SUMMER CAR 2021 MOBILE iOS ====="
          echo "Source Unity: $SOURCE_UNITY"
          echo "Migration Unity: $MIGRATION_UNITY"
          echo "Build Unity: $BUILD_UNITY"
          echo "Project: $PROJECT"
          echo "Output: $MSC_IOS_XCODE_PATH"

          timeout 120m \
            xvfb-run -a \
            "$UNITY2019" \
            -batchmode \
            -nographics \
            -quit \
            -accept-apiupdate \
            -projectPath "$PROJECT" \
            -buildTarget iOS \
            -executeMethod MSC2021IOSBuild.PerformBuild \
            -logFile "$LOG"

          RC=$?

          echo "UNITY2019_EXIT_CODE=$RC" \
            | tee "$OUTPUT/unity-2019-exit-code.txt"

          echo "===== UNITY LOG TAIL ====="
          tail -600 "$LOG" || true

          echo "===== IMPORTANT UNITY ERRORS ====="

          grep -nEi \
            -A 25 \
            -B 8 \
            'error CS[0-9]+|Compilation failed|Scripts have compiler errors|compiler error|Exception|Error building Player|BuildFailedException|DllNotFoundException|TypeLoadException|MissingReferenceException|Fatal error|failed' \
            "$LOG" \
            | tail -800 \
            | tee "$OUTPUT/unity-build-important-errors.txt" \
            || true

          exit "$RC"

      - name: Detect Xcode project
        id: detect_xcode
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          READY=false

          if [ -d "$XCODE_OUT" ] && \
             find "$XCODE_OUT" \
               -maxdepth 4 \
               \( \
                 -name '*.xcodeproj' \
                 -o -name '*.xcworkspace' \
               \) \
               | grep -q .
          then
            READY=true
          fi

          echo "ready=$READY" >> "$GITHUB_OUTPUT"

          if [ "$READY" = true ]; then
            find "$XCODE_OUT" \
              -maxdepth 4 \
              \( \
                -name '*.xcodeproj' \
                -o -name '*.xcworkspace' \
              \) \
              -print
          else
            echo "No Xcode project was generated."
          fi

      - name: Pack Xcode project
        if: steps.detect_xcode.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail

          tar \
            -C "$(dirname "$XCODE_OUT")" \
            -czf \
              "$GITHUB_WORKSPACE/MSC2021-Mobile-iOS-v1-Xcode.tar.gz" \
            "$(basename "$XCODE_OUT")"

          ls -lh "$GITHUB_WORKSPACE/MSC2021-Mobile-iOS-v1-Xcode.tar.gz"

      - name: Collect Unity diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          DIAG="$GITHUB_WORKSPACE/MSC2021-Mobile-iOS-v1-Diagnostics"

          rm -rf "$DIAG"
          mkdir -p "$DIAG"

          cp "$OUTPUT"/*.txt "$DIAG/" 2>/dev/null || true
          cp "$OUTPUT"/*.log "$DIAG/" 2>/dev/null || true
          cp "$OUTPUT/MSC2021-original-icon.png" "$DIAG/" 2>/dev/null || true

          if [ -n "${PROJECT:-}" ] && [ -f "$PROJECT/ProjectSettings/ProjectVersion.txt" ]; then
            cp "$PROJECT/ProjectSettings/ProjectVersion.txt" "$DIAG/" || true
          fi

          {
            echo "SOURCE_UNITY=$SOURCE_UNITY"
            echo "MIGRATION_UNITY=$MIGRATION_UNITY"
            echo "BUILD_UNITY=$BUILD_UNITY"
            echo "XCODE_READY=${{ steps.detect_xcode.outputs.ready }}"
            echo "RECOVER_OUTCOME=${{ steps.recover.outcome }}"
            echo "WARMUP_OUTCOME=${{ steps.warmup.outcome }}"
            echo "UNITY_BUILD_OUTCOME=${{ steps.unity_build.outcome }}"
          } > "$DIAG/summary.txt"

          grep -RniE \
            'error CS[0-9]+|Compilation failed|compiler error|Exception|failed|failure|unsupported|DllNotFoundException|TypeLoadException|MissingReferenceException|BuildFailedException' \
            "$DIAG" \
            > "$DIAG/important-errors.txt" \
            2>/dev/null || true

          zip -qr \
            "$GITHUB_WORKSPACE/MSC2021-Mobile-iOS-v1-Diagnostics.zip" \
            "$DIAG"

      - name: Upload Unity diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MSC2021-Mobile-iOS-v1-Diagnostics
          path: MSC2021-Mobile-iOS-v1-Diagnostics.zip
          compression-level: 0
          if-no-files-found: warn

      - name: Upload Xcode project
        if: steps.detect_xcode.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MSC2021-Mobile-iOS-v1-Xcode
          path: MSC2021-Mobile-iOS-v1-Xcode.tar.gz
          compression-level: 0
          if-no-files-found: error

      - name: Fail clearly if Unity did not export Xcode
        if: always() && steps.detect_xcode.outputs.ready != 'true'
        shell: bash
        run: |
          echo "::error::Unity did not generate the MSC2021 iOS Xcode project."
          echo "Download MSC2021-Mobile-iOS-v1-Diagnostics and send it here."
          exit 1

  xcode_build:
    name: 2. Build unsigned IPA on macOS
    needs: recover_and_export
    if: needs.recover_and_export.outputs.xcode_ready == 'true'
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Download Xcode project
        uses: actions/download-artifact@v4
        with:
          name: MSC2021-Mobile-iOS-v1-Xcode
          path: xcode-artifact

      - name: Extract Xcode project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf xcode
          mkdir -p xcode

          ARCHIVE="$(
            find xcode-artifact \
              -type f \
              -name '*.tar.gz' \
              -print \
              | head -1
          )"

          test -s "$ARCHIVE"

          tar -xzf "$ARCHIVE" -C xcode

          find xcode \
            -maxdepth 5 \
            \( \
              -name '*.xcodeproj' \
              -o -name '*.xcworkspace' \
            \) \
            -print

      - name: Patch project for modern Xcode
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild -version

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("xcode")
          changed = []

          for p in root.rglob("*"):
              if not p.is_file():
                  continue

              if not (
                  p.name == "project.pbxproj" or
                  p.suffix == ".xcconfig"
              ):
                  continue

              try:
                  s = p.read_text(
                      encoding="utf-8",
                      errors="ignore"
                  )
              except Exception:
                  continue

              old = s

              s = s.replace("-mno-thumb", "")

              s = re.sub(
                  r'IPHONEOS_DEPLOYMENT_TARGET = [^;]+;',
                  'IPHONEOS_DEPLOYMENT_TARGET = 12.0;',
                  s
              )

              s = re.sub(
                  r'ENABLE_BITCODE = [^;]+;',
                  'ENABLE_BITCODE = NO;',
                  s
              )

              s = re.sub(
                  r'CODE_SIGN_STYLE = [^;]+;',
                  'CODE_SIGN_STYLE = Manual;',
                  s
              )

              if s != old:
                  p.write_text(s, encoding="utf-8")
                  changed.append(str(p))

          print("Patched files:", len(changed))

          for p in changed:
              print(" ", p)
          PY

          if grep -RIn -- '-mno-thumb' xcode; then
            echo "::error::Legacy -mno-thumb flag still exists."
            exit 1
          fi

          echo "Modern Xcode flag audit: CLEAN"

      - name: Resolve Xcode container
        shell: bash
        run: |
          set -euo pipefail

          WORKSPACE="$(
            find xcode \
              -type d \
              -name '*.xcworkspace' \
              -print \
              | head -1
          )"

          PROJECT="$(
            find xcode \
              -type d \
              -name '*.xcodeproj' \
              -print \
              | head -1
          )"

          if [ -n "$WORKSPACE" ]; then
            echo "XCODE_KIND=workspace" >> "$GITHUB_ENV"
            echo "XCODE_CONTAINER=$WORKSPACE" >> "$GITHUB_ENV"
            xcodebuild -list -workspace "$WORKSPACE"
          elif [ -n "$PROJECT" ]; then
            echo "XCODE_KIND=project" >> "$GITHUB_ENV"
            echo "XCODE_CONTAINER=$PROJECT" >> "$GITHUB_ENV"
            xcodebuild -list -project "$PROJECT"
          else
            echo "::error::No Xcode workspace/project found."
            exit 1
          fi

      - name: Build unsigned app
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail

          rm -rf DerivedData xcode-build.log

          if [ "$XCODE_KIND" = "workspace" ]; then
            CONTAINER_ARGS=(
              -workspace "$XCODE_CONTAINER"
            )
          else
            CONTAINER_ARGS=(
              -project "$XCODE_CONTAINER"
            )
          fi

          xcodebuild \
            "${CONTAINER_ARGS[@]}" \
            -scheme "Unity-iPhone" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ENABLE_BITCODE=NO \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            build \
            2>&1 \
            | tee xcode-build.log

      - name: Validate app
        id: app
        shell: bash
        run: |
          set -euo pipefail

          APP="$(
            find DerivedData/Build/Products \
              -type d \
              -path '*Release-iphoneos/*.app' \
              -print \
              | head -1
          )"

          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "::error::.app was not found."
            exit 1
          fi

          PLIST="$APP/Info.plist"
          test -s "$PLIST"

          EXEC="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' \
              "$PLIST"
          )"

          test -s "$APP/$EXEC"

          APP_KB="$(du -sk "$APP" | awk '{print $1}')"

          echo "APP_SIZE_KB=$APP_KB"

          if [ "$APP_KB" -lt 20000 ]; then
            echo "::error::App is suspiciously small."
            exit 1
          fi

          echo "path=$APP" >> "$GITHUB_OUTPUT"

          echo "===== APP VERIFIED ====="
          du -sh "$APP"
          file "$APP/$EXEC"
          lipo -info "$APP/$EXEC" || true

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP="${{ steps.app.outputs.path }}"

          rm -rf Payload
          mkdir -p Payload

          cp -a "$APP" Payload/
          xattr -cr Payload || true

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            "MSC2021-Mobile-iOS-v1-unsigned.ipa"

          ls -lh "MSC2021-Mobile-iOS-v1-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: MSC2021-Mobile-iOS-v1-unsigned-IPA
          path: MSC2021-Mobile-iOS-v1-unsigned.ipa
          compression-level: 0
          if-no-files-found: error

      - name: Collect Xcode diagnostics
        if: failure()
        shell: bash
        run: |
          set +e

          DIAG="MSC2021-Mobile-iOS-v1-Xcode-Diagnostics"

          rm -rf "$DIAG"
          mkdir -p "$DIAG"

          cp xcode-build.log "$DIAG/" 2>/dev/null || true

          PBX="$(
            find xcode \
              -type f \
              -name 'project.pbxproj' \
              -print \
              | head -1
          )"

          if [ -n "$PBX" ]; then
            cp "$PBX" "$DIAG/" 2>/dev/null || true
          fi

          {
            xcodebuild -version
            echo
            echo "XCODE_KIND=$XCODE_KIND"
            echo "XCODE_CONTAINER=$XCODE_CONTAINER"
          } > "$DIAG/xcode-info.txt"

          grep -nEi \
            -A 20 \
            -B 8 \
            'error:|fatal error|undefined symbol|ld:|clang:|failed|failure' \
            xcode-build.log \
            | tail -800 \
            > "$DIAG/important-errors.txt" \
            2>/dev/null || true

      - name: Upload Xcode diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MSC2021-Mobile-iOS-v1-Xcode-Diagnostics
          path: MSC2021-Mobile-iOS-v1-Xcode-Diagnostics
          compression-level: 0
          if-no-files-found: warn
